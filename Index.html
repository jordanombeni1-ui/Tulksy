<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talksy</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{
  --primary:#0a1929;
  --primary-light:#1a3a5c;
  --accent:#25D366;
  --pink-neon:#ff4081; /* Nouvelle couleur rose */
  --glass:rgba(10,25,41,0.55);
  --glass-border:rgba(255,64,129,0.3); /* Bordure rose */
}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.app{width:100%;max-width:450px;height:100vh;background:#f0f2f5;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(160deg,#0a1929 0%,#1a3a5c 50%,#2d1b3d 100%);color:white;animation:splashOut 2.6s ease forwards;}
#splash h1{font-size:56px;letter-spacing:2px;font-weight:800}
#splash h1 span{color:var(--accent)}
@keyframes splashOut{0%,80%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}

/* ===== LOGIN (Design inchangé) ===== */
#loginScreen{display:none;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:40px 30px;background:linear-gradient(160deg,#0a1929 0%,#1a3a5c 50%,#2d1b3d 100%);color:white;}
.avatar-upload{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;margin-bottom:20px;border:2px dashed rgba(255,255,255,.3);background-size:cover;background-position:center;overflow:hidden;transition:.2s;position:relative;}
.avatar-upload .plus-badge{position:absolute;bottom:0;right:0;background:var(--accent);color:#0a1929;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;border:2px solid #0a1929}
.login-field{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 16px;color:white;font-size:15px;margin-bottom:14px;outline:none;backdrop-filter:blur(10px);}
.login-field::placeholder{color:rgba(255,255,255,.5)}
.btn-login{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:600;background:var(--accent);color:#0a1929;cursor:pointer;margin-top:10px;}

/* ===== THÈME ROSE / NOIR CONNECTÉ ===== */
#listScreen{display:none;flex-direction:column;height:100%;background:linear-gradient(160deg,#0a0a0a 0%,#1a0b14 50%,#0a1929 100%)}
header{background:rgba(15,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
.header-actions span{cursor:pointer;font-size:22px;margin-left:15px}
.menu-btn{cursor:pointer;font-size:24px;margin-right:10px;color:var(--pink-neon)}

/* Menu Premium */
#premiumMenu{display:none;position:absolute;top:60px;left:10px;background:rgba(20,20,20,.95);border:1px solid var(--pink-neon);border-radius:12px;padding:15px;z-index:100;color:white;box-shadow:0 10px 30px rgba(255,64,129,.3);width:220px;}
#premiumMenu h3{color:var(--pink-neon);margin-bottom:10px;font-size:16px}
#premiumMenu p{font-size:12px;opacity:.8;margin-bottom:15px;line-height:1.4}
#premiumMenu button{width:100%;padding:10px;background:var(--pink-neon);border:none;border-radius:8px;font-weight:bold;color:#0a1929;cursor:pointer}

/* Bouton flottant ajouter contact */
.fab-add{position:absolute;bottom:20px;left:20px;background:var(--pink-neon);color:#0a1929;width:55px;height:55px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 5px 15px rgba(255,64,129,.5);cursor:pointer;z-index:50;transition:.2s}
.fab-add:hover{transform:scale(1.1)}

/* ===== LISTE CONTACTS ===== */
#liste{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.contact{display:flex;gap:12px;padding:12px 14px;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.05);backdrop-filter:blur(14px);border:1px solid var(--glass-border);box-shadow:0 4px 20px rgba(0,0,0,.25);}
.contact:hover{background:rgba(255,64,129,.1);transform:translateY(-2px);}
.avatar{width:52px;height:52px;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;position:relative;background-size:cover;background-position:center;}
.info b{display:block;font-size:15px;color:#ffd6e6;}
.info span{color:rgba(255,220,235,.6);font-size:13px;}

/* ===== CHAT ===== */
#chatScreen{display:none;flex-direction:column;height:100%;background:#0a0f18}
.chat-header{background:rgba(15,10,15,.9);border-bottom:1px solid var(--glass-border);color:white;padding:10px 14px;display:flex;align-items:center;gap:10px;}
#messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,#0a0a0a 0%,#1a0b14 50%,#0a1929 100%);}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;position:relative;word-wrap:break-word;}
.lui{align-self:flex-start;background:linear-gradient(135deg,#5b9bd5 0%,#ff9ec7 100%);color:#fff;}
.moi{align-self:flex-end;background:linear-gradient(135deg,#0a1929 0%,#1e3a5f 100%);color:#e8f0f8;}
.input-bar{display:flex;padding:10px;gap:8px;background:rgba(15,10,15,.9);border-top:1px solid var(--glass-border);align-items:center;}
.input-bar input{flex:1;padding:13px 18px;border:none;border-radius:24px;outline:none;font-size:15px;background:rgba(255,255,255,.1);color:white;}
.input-bar button{background:var(--pink-neon);border:none;color:#0a1929;width:46px;height:46px;border-radius:50%;font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash"><h1>Talksy<span>.</span></h1></div>

<div class="app">
  <!-- LOGIN (avec Appareil photo et sélecteur de pays) -->
  <div id="loginScreen">
    <div class="avatar-upload" id="avatarUpload" onclick="document.getElementById('loginAvatarFile').click()">
      <span id="avatarUploadText">📷</span>
      <div class="plus-badge">+</div>
    </div>
    <input type="file" id="loginAvatarFile" accept="image/*" style="display:none" onchange="previewAvatar(this)">
    <h1>Talksy<span>.</span></h1>
    <p>Créez votre compte</p>
    <input class="login-field" id="loginName" type="text" placeholder="Votre nom" autocomplete="off">
    
    <!-- Sélecteur de pays avec drapeau -->
    <div style="display:flex;width:100%;gap:10px;margin-bottom:14px">
      <select id="countryCode" class="login-field" style="width:110px;padding:14px 5px;background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.2);border-radius:12px;outline:none" onchange="updatePlaceholder()">
        <option value="+243">🇨🇩 +243</option>
        <option value="+1">🇺🇸 +1</option>
        <option value="+33">🇫🇷 +33</option>
        <option value="+242">🇨🇬 +242</option>
        <option value="+225">🇨🇮 +225</option>
        <option value="+237">🇨🇲 +237</option>
        <option value="+221">🇸🇳 +221</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+250">🇷🇼 +250 Rwanda</option>
<option value="+244">🇦🇴 +244 Angola</option>
<option value="+256">🇺🇬 +256 Ouganda</option>
<option value="+255">🇹🇿 +255 Tanzanie</option>
<option value="+254">🇰🇪 +254 Kenya</option>
<option value="+241">🇬🇦 +241 Gabon</option>
<option value="+235">🇹🇩 +235 Tchad</option>
<option value="+236">🇨🇫 +236 Centrafrique</option>
<option value="+223">🇲🇱 +223 Mali</option>
<option value="+226">🇧🇫 +226 Burkina Faso</option>
<option value="+229">🇧🇯 +229 Bénin</option>
<option value="+228">🇹🇬 +228 Togo</option>
<option value="+233">🇬🇭 +233 Ghana</option>
<option value="+234">🇳🇬 +234 Nigeria</option>
<option value="+27">🇿🇦 +27 Afrique du Sud</option>
<option value="+212">🇲🇦 +212 Maroc</option>
<option value="+213">🇩🇿 +213 Algérie</option>
<option value="+216">🇹🇳 +216 Tunisie</option>
<option value="+20">🇪🇬 +20 Égypte</option>
<option value="+32">🇧🇪 +32 Belgique</option>
<option value="+41">🇨🇭 +41 Suisse</option>
<option value="+49">🇩🇪 +49 Allemagne</option>
<option value="+34">🇪🇸 +34 Espagne</option>
<option value="+39">🇮🇹 +39 Italie</option>
<option value="+31">🇳🇱 +31 Pays-Bas</option>
<option value="+351">🇵🇹 +351 Portugal</option>
<option value="+86">🇨🇳 +86 Chine</option>
<option value="+81">🇯🇵 +81 Japon</option>
<option value="+82">🇰🇷 +82 Corée</option>
<option value="+91">🇮🇳 +91 Inde</option>
<option value="+971">🇦🇪 +971 Dubaï</option>
<option value="+966">🇸🇦 +966 Arabie Saoudite</option>
<option value="+90">🇹🇷 +90 Turquie</option>
<option value="+55">🇧🇷 +55 Brésil</option>
<option value="+52">🇲🇽 +52 Mexique</option>
      </select>
      <input class="login-field" id="loginPhone" type="tel" placeholder="Numéro de téléphone" style="margin-bottom:0; flex:1" autocomplete="off">
    </div>

    <button class="btn-login" onclick="seConnecter()">Se connecter</button>
    <div class="login-error" id="loginError" style="color:#ff6b6b;font-size:13px;margin-top:10px;display:none"></div>
  </div>

  <!-- LISTE CONNECTÉ -->
  <div id="listScreen">
    <header>
      <div style="display:flex;align-items:center">
        <span class="menu-btn" onclick="togglePremium()">⋮</span>
        <h2 style="font-size:19px;color:#ffd6e6">Talksy</h2>
      </div>
      <div class="header-actions">
        <span onclick="ouvrirNouveauStatut()">📸</span>
        <div class="user-badge" onclick="deconnecter()" style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <span class="avatar-circle" id="headerAvatar" style="width:28px;height:28px;border-radius:50%;background:var(--pink-neon);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#0a1929">?</span>
        </div>
      </div>
    </header>
    
    <!-- Menu Premium -->
    <div id="premiumMenu">
      <h3>👑 Premium</h3>
      <p>Débloquez les conversations de groupe et les appels vidéo à plusieurs.</p>
      <button onclick="payerPremium()">S'abonner (5$/mois)</button>
    </div>

    <div id="statusBar" style="display:none"></div>
    <div class="search"><input type="text" placeholder="🔍 Rechercher..." onkeyup="filtrer(this.value)" style="width:100%;padding:11px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:white"></div>
    <div id="liste"></div>
    
    <!-- Bouton Ajout Contact -->
    <div class="fab-add" onclick="ajouterContact()">+</div>
  </div>

  <!-- CHAT -->
  <div id="chatScreen">
    <div class="chat-header">
      <button onclick="retour()" style="background:none;border:none;color:white;font-size:22px">←</button>
      <div class="avatar" id="chatAvatar" style="width:42px;height:42px;font-size:17px;background:var(--pink-neon);color:#0a1929;border-radius:50%;display:flex;align-items:center;justify-content:center">I</div>
      <div class="chat-header-info" style="flex:1">
        <b id="chatNom" style="display:block;font-size:16px">Nom</b>
        <small id="chatStatus" style="font-size:11px;opacity:.75">en ligne</small>
      </div>
    </div>
    <div id="messages"></div>
    <div class="input-bar">
      <label for="fileInput" style="cursor:pointer;font-size:22px;color:#ffd6e6">📎</label>
      <input type="file" id="fileInput" style="display:none" onchange="envoyerFichier(this)">
      <input id="inputMsg" placeholder="Message..." onkeydown="if(event.key==='Enter') envoyer()">
      <button onclick="envoyer()">➤</button>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:3000"; // ⚠️ METTRE L'URL DE TON SERVEUR ICI PLUS TARD
const socket = io(API);
let utilisateur = null;
let contacts = {};
let chatActuelId = null;
let messagesParChat = {};

// ====== LOGIN ======
setTimeout(()=>{
  document.getElementById("splash").style.display = "none";
  const saved = localStorage.getItem("talksy_user");
  if (saved) { utilisateur = JSON.parse(saved); entrerApp(); } 
  else { document.getElementById("loginScreen").style.display = "flex"; }
}, 2500);

function updatePlaceholder() {
  const code = document.getElementById("countryCode").value;
  document.getElementById("loginPhone").placeholder = `Ex: 812345678`;
}

function previewAvatar(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("avatarUpload").style.backgroundImage = `url(${e.target.result})`;
    document.getElementById("avatarUploadText").style.display = "none";
    window._tempAvatar = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function seConnecter(){
  const nom = document.getElementById("loginName").value.trim();
  const code = document.getElementById("countryCode").value;
  const num = document.getElementById("loginPhone").value.trim();
  if(nom.length < 2 || num.length < 5) return alert("Remplis bien les champs");
  
  const telComplet = code + num;

  try{
    const res = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nom, telephone: telComplet, avatar: window._tempAvatar || null })
    });
    utilisateur = await res.json();
    localStorage.setItem("talksy_user", JSON.stringify(utilisateur));
    entrerApp();
  }catch(e){
    alert("Impossible de joindre le serveur. Es-tu sûr que le serveur tourne ?");
  }
}

function entrerApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("listScreen").style.display = "flex";
  document.getElementById("headerAvatar").innerHTML = utilisateur.avatar
    ? `<img src="${utilisateur.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`
    : utilisateur.nom[0].toUpperCase();

  socket.emit("user:online", utilisateur.id);
  chargerUtilisateurs();
}

function deconnecter(){
  if(confirm("Se déconnecter ?")){ localStorage.removeItem("talksy_user"); location.reload(); }
}

// ====== PREMIUM MENU ======
function togglePremium(){
  const m = document.getElementById("premiumMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}
function payerPremium(){
  alert("Paiement Mobile Money / Carte à venir. Fonctionnalité Premium bientôt disponible !");
  togglePremium();
}

// ====== AJOUTER CONTACT ======
function ajouterContact(){
  const num = prompt("Entrez le numéro de téléphone de votre contact (avec le code pays ex: +243810000000) :");
  if(!num) return;
  // On demande au serveur de chercher ce numéro
  fetch(API + "/api/users").then(r => r.json()).then(users => {
    const found = users.find(u => u.telephone.includes(num));
    if(found){
      alert("Contact trouvé : " + found.nom);
      contacts[found.id] = found;
      afficherListe();
    } else {
      alert("Aucun utilisateur Talksy trouvé avec ce numéro.");
    }
  });
}

// ====== SOCKET & LISTE ======
socket.on("users:update", (users) => {
  contacts = {};
  users.forEach(u => { if (u.id !== utilisateur.id) contacts[u.id] = u; });
  afficherListe();
});

function chargerUtilisateurs(){
  fetch(API + "/api/users").then(r => r.json()).then(users => {
    contacts = {};
    users.forEach(u => { if (u.id !== utilisateur.id) contacts[u.id] = u; });
    afficherListe();
  });
}

function afficherListe(filtre=""){
  const liste = Object.values(contacts);
  if (!liste.length){
    document.getElementById("liste").innerHTML = '<div style="padding:30px;text-align:center;color:#aaa">Aucun contact. Clique sur le bouton + en bas à gauche pour en ajouter.</div>';
    return;
  }
  let html = "";
  liste.forEach(u => {
    if (!u.nom.toLowerCase().includes(filtre.toLowerCase())) return;
    const av = u.avatar 
      ? `<div class="avatar" style="background-image:url(${u.avatar})"></div>` 
      : `<div class="avatar" style="background:#ff4081;color:#0a1929">${u.nom[0].toUpperCase()}</div>`;
    html += `<div class="contact" onclick="ouvrirChat('${u.id}')">
      ${av}
      <div class="info"><b>${u.nom}</b><span>${u.telephone}</span></div>
    </div>`;
  });
  document.getElementById("liste").innerHTML = html;
}
function filtrer(v){ afficherListe(v); }

// ====== CHAT ======
function ouvrirChat(id){
  chatActuelId = id;
  const u = contacts[id];
  document.getElementById("listScreen").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  document.getElementById("chatNom").innerText = u.nom;
  afficherMessages();
}

function chatKey(a,b){ return [a,b].sort().join("_"); }

function afficherMessages(){
  if (!chatActuelId) return;
  const key = chatKey(utilisateur.id, chatActuelId);
  const list = messagesParChat[key] || [];
  let html = "";
  list.forEach(m => {
    const classe = m.from === utilisateur.id ? "moi" : "lui";
    let contenu = m.text || "";
    if(m.media) contenu += `<br><img src="${API}${m.media.url}" style="max-width:100%;border-radius:10px;margin-top:5px">`;
    html += `<div class="msg ${classe}">${contenu}</div>`;
  });
  document.getElementById("messages").innerHTML = html;
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

function envoyer(){
  const input = document.getElementById("inputMsg");
  if (!input.value.trim() || !chatActuelId) return;
  const msg = { from: utilisateur.id, to: chatActuelId, text: input.value, heure: new Date().toLocaleTimeString() };
  socket.emit("message:send", msg);
  input.value = "";
}

socket.on("message:new", (m) => {
  const key = chatKey(m.from, m.to);
  if (!messagesParChat[key]) messagesParChat[key] = [];
  messagesParChat[key].push(m);
  if (chatActuelId && (m.from === chatActuelId || m.to === chatActuelId)) afficherMessages();
  afficherListe();
});

async function envoyerFichier(input){
  const file = input.files[0];
  if (!file || !chatActuelId) return;
  const fd = new FormData(); fd.append("file", file);
  const res = await fetch(API + "/upload", { method: "POST", body: fd });
  const data = await res.json();
  socket.emit("message:send", { from: utilisateur.id, to: chatActuelId, text: "", media: data, heure: new Date().toLocaleTimeString() });
  input.value = "";
}

function retour(){
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("listScreen").style.display = "flex";
  chatActuelId = null;
  afficherListe();
}
</script>
</body>
</html>
